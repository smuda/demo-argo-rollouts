argo:
  project: addons
  common:
    valueFiles: []
    target_revision: main
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    apps_namespace: argocd
    enableLabelManagement: true

cert_manager:
  use: true
  podSecurityLevel: restricted

cert_manager_config:
  use: true

grafanaOperator:
  use: true
  podSecurityLevel: restricted

ingressNginx:
  use: true
  podSecurityLevel: baseline

metricsServer:
  use: false
  podSecurityLevel: privileged

nginxIngress:
  use: false
  podSecurityLevel: baseline

prometheus:
  use: false
  podSecurityLevel: baseline

reloader:
  use: true
  podSecurityLevel: restricted
