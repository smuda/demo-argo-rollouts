{{- if .Values.rollout.use -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cider
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 2
      canaryMetadata:
        labels:
          environment: canary
      {{- if .Values.rollout.metrics.use }}
      analysis:
        #args:
        #  - name: cider
        #    value: rollouts-demo-canary
        templates:
          - templateName: good-traffic
      {{- end }}
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause: {duration: 30}
        - setWeight: 60
        - pause: {duration: 10}
        - setWeight: 80
        - pause: {duration: 10}

      stableService: cider
      canaryService: cider-canary
      trafficRouting:
        nginx:
          # Reference to an Ingress which has a rule pointing to the stable service (e.g. rollouts-demo-stable)
          # This ingress will be cloned with a new name, in order to achieve NGINX traffic splitting.
          stableIngress: cider
          canaryIngress: cider-canary

  selector:
    matchLabels:
      app: cider
      type: rollout
  template:
    metadata:
      labels:
        app: cider
        type: rollout
    spec:
      containers:
        - name: main
          image: docker.io/smuda/demo-rollouts:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VERSION
              value: "{{ .Values.version }}"
            - name: GOOD
              {{ if .Values.isGood }}
              value: "yes"
              {{- else }}
              value: "no"
              {{- end }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 30000
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1G
{{- end -}}
